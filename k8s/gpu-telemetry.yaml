apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-telemetry
  namespace: llm-inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: inference-gpu-telemetry
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: inference-gpu-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: inference-gpu-telemetry
subjects:
  - kind: ServiceAccount
    name: gpu-telemetry
    namespace: llm-inference
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-telemetry
  namespace: llm-inference
spec:
  selector:
    matchLabels: {app: gpu-telemetry}
  template:
    metadata:
      labels: {app: gpu-telemetry}
    spec:
      serviceAccountName: gpu-telemetry
      runtimeClassName: nvidia
      nodeSelector: {nvidia.com/gpu.present: "true"}
      containers:
        - name: agent
          image: REPLACE_WITH_REGISTRY/gpu-telemetry:latest
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {memory: 128Mi}
