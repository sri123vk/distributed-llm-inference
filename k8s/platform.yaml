apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inference-worker
spec:
  serviceName: inference-worker
  replicas: 2
  selector:
    matchLabels: {app: inference-worker}
  template:
    metadata:
      labels: {app: inference-worker}
    spec:
      containers:
        - name: worker
          image: REPLACE_WITH_REGISTRY/inference-worker:latest
          ports: [{containerPort: 8001}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8001}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-worker
spec:
  clusterIP: None
  selector: {app: inference-worker}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels: {app: inference-gateway}
  template:
    metadata:
      labels: {app: inference-gateway}
    spec:
      containers:
        - name: gateway
          image: REPLACE_WITH_REGISTRY/inference-gateway:latest
          env:
            - name: WORKERS
              value: http://inference-worker-0.inference-worker:8001,http://inference-worker-1.inference-worker:8001
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
spec:
  selector: {app: inference-gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduler-extender
spec:
  replicas: 1
  selector:
    matchLabels: {app: gpu-scheduler-extender}
  template:
    metadata:
      labels: {app: gpu-scheduler-extender}
    spec:
      containers:
        - name: extender
          image: REPLACE_WITH_REGISTRY/gpu-scheduler-extender:latest
          ports: [{containerPort: 8002}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8002}
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-scheduler-extender
spec:
  selector: {app: gpu-scheduler-extender}
  ports: [{port: 8002, targetPort: 8002}]
